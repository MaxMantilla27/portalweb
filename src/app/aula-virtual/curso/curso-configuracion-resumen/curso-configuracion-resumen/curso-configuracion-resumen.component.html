<ng-container>
    <div *ngIf="isLoading" class="spinner-overlay">
        <mat-spinner></mat-spinner>
    </div>
    <div class="col-12">
        <div class="row">
            <div class="col-12">
                <div style="color: #4a4a4a;
                    font-size: 16px;
                    font-weight: 600;
                    padding-bottom: 20px;
                    border-bottom: solid 1px #ececec;
                    margin: 20px 0px;">Tipos de resumen</div>
            </div>
            <div class="col-12" style="width: calc( 100% - 50px ); padding-bottom: 20px;">
                <div class="row mb-3">
                    <div class="col-6">
                        <label style="width: 160px;">Pdf</label>
                        <mat-checkbox [(ngModel)]="pdfChecked" (change)="checkResumenChanged()"></mat-checkbox>
                    </div>
                    <div class="col-6">
                        <label style="width: 160px;">Mapa conceptual</label>
                        <mat-checkbox [(ngModel)]="mapaConceptualChecked" (change)="checkResumenChanged()"></mat-checkbox>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label style="width: 160px;">Audio</label>
                        <mat-checkbox [(ngModel)]="audioChecked" (change)="checkResumenChanged()"></mat-checkbox>
                    </div>
                    <div class="col-6">
                        <label style="width: 160px;">Video</label>
                        <mat-checkbox [(ngModel)]="videoChecked" (change)="checkResumenChanged()"></mat-checkbox>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12" [ngClass]="{'disabled-block': !isResumenChecked}">
                <div style="color: #4a4a4a;
                    font-size: 16px;
                    font-weight: 600;
                    padding-bottom: 30px;
                    border-bottom: solid 1px #ececec;
                    margin: 20px 0px;">Medios
                </div>
            </div>
            <div class="col-12" style="width: calc( 100% - 50px ); padding-bottom: 20px;">
                <div class="row mb-3">
                    <div class="col-6">
                        <label style="width: 160px;">Correo</label>
                        <mat-checkbox [(ngModel)]="correoChecked" [disabled]="!isResumenChecked"></mat-checkbox>
                    </div>
                    <div class="col-6">
                        <label style="width: 160px;">WhatsApp</label>
                        <mat-checkbox [(ngModel)]="whatsAppChecked" [disabled]="!isResumenChecked"></mat-checkbox>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-6">
                <app-default-button
                    [confs]="{color:'primary',titulo:'Actualizar'}"
                    [style]="'width: 150px;margin: 0px 0px 10px 0px;'"
                    (ButtoclClick)="actualizarConfiguracionResumen()">
                </app-default-button>
            </div>
            <div class="col-6">
                <app-default-button
                    [confs]="{color:'primary',titulo:'Cancelar'}"
                    [style]="'width: 150px;margin: 0px 0px 10px 0px;'"
                    (ButtoclClick)="cancelarConfiguracionResumen()">
                </app-default-button>
            </div>
        </div>
    </div>
</ng-container>
